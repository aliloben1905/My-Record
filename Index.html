<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سجل السيارات والصيانة</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f8;
    color: #1f2937;
    padding: 15px;
}

.container {
    max-width: 1000px;
    margin: auto;
}

/* الرأس */
.header {
    background: #111827;
    color: white;
    padding: 22px;
    border-radius: 15px;
    margin-bottom: 15px;
}

.header h1 {
    font-size: 24px;
    margin-bottom: 7px;
}

.header p {
    color: #d1d5db;
}

/* الأزرار */
button {
    border: none;
    border-radius: 8px;
    padding: 11px 15px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
}

.add-button {
    background: #2563eb;
    color: white;
}

.add-button:hover {
    background: #1d4ed8;
}

.edit-button {
    background: #f59e0b;
    color: white;
}

.delete-button {
    background: #ef4444;
    color: white;
}

.service-button {
    background: #16a34a;
    color: white;
}

/* البحث */
.search-box {
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
}

.search-box input {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
}

/* الإحصائيات */
.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 15px;
}

.stat {
    background: white;
    padding: 17px;
    border-radius: 12px;
    text-align: center;
}

.stat strong {
    display: block;
    font-size: 23px;
    margin-top: 5px;
}

/* البطاقات */
.car-list {
    display: grid;
    gap: 15px;
}

.car-card {
    background: white;
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.car-header {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 15px;
}

.car-name {
    font-size: 20px;
    font-weight: bold;
}

.owner {
    color: #6b7280;
    margin-top: 5px;
}

.info {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 15px;
}

.info-box {
    background: #f9fafb;
    padding: 10px;
    border-radius: 8px;
}

.info-box small {
    display: block;
    color: #6b7280;
    margin-bottom: 4px;
}

.info-box strong {
    font-size: 14px;
}

.repair {
    background: #f0fdf4;
    border-right: 4px solid #16a34a;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 7px;
}

.repair-title {
    font-weight: bold;
    margin-bottom: 5px;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

/* النافذة */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 1000;
    padding: 15px;
    overflow-y: auto;
}

.modal-content {
    background: white;
    max-width: 550px;
    margin: 30px auto;
    border-radius: 15px;
    padding: 20px;
}

.modal-content h2 {
    margin-bottom: 18px;
}

.form-group {
    margin-bottom: 14px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
}

.form-group textarea {
    min-height: 100px;
    resize: vertical;
}

.form-buttons {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.save-button {
    background: #2563eb;
    color: white;
}

.cancel-button {
    background: #6b7280;
    color: white;
}

.empty {
    background: white;
    text-align: center;
    padding: 35px;
    border-radius: 12px;
    color: #6b7280;
}

/* الهاتف */
@media (max-width: 650px) {
    body {
        padding: 8px;
    }

    .header h1 {
        font-size: 21px;
    }

    .info {
        grid-template-columns: 1fr 1fr;
    }

    .car-header {
        flex-direction: column;
    }

    .actions button {
        flex: 1;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🚗 سجل صيانة السيارات</h1>
        <p>إدارة سيارات الزبائن ومتابعة الصيانة بسهولة</p>
    </div>

    <div style="margin-bottom:15px;">
        <button class="add-button" onclick="openCarModal()">
            ➕ إضافة سيارة
        </button>
    </div>

    <div class="stats">
        <div class="stat">
            عدد السيارات
            <strong id="carCount">0</strong>
        </div>

        <div class="stat">
            إجمالي عمليات الصيانة
            <strong id="serviceCount">0</strong>
        </div>
    </div>

    <div class="search-box">
        <input
            type="text"
            id="search"
            placeholder="🔍 ابحث باسم صاحب السيارة أو نوع السيارة..."
            oninput="displayCars()"
        >
    </div>

    <div id="carList" class="car-list"></div>

</div>

<!-- نافذة إضافة / تعديل سيارة -->
<div id="carModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">➕ إضافة سيارة</h2>

        <div class="form-group">
            <label>اسم صاحب السيارة</label>
            <input type="text" id="ownerName" placeholder="مثال: محمد">
        </div>

        <div class="form-group">
            <label>اسم / نوع السيارة</label>
            <input type="text" id="carName" placeholder="مثال: Peugeot 208">
        </div>

        <div class="form-group">
            <label>سنة السيارة</label>
            <input type="number" id="carYear" placeholder="مثال: 2018">
        </div>

        <div class="form-buttons">
            <button class="save-button" onclick="saveCar()">حفظ</button>
            <button class="cancel-button" onclick="closeCarModal()">إلغاء</button>
        </div>
    </div>
</div>

<!-- نافذة إضافة صيانة -->
<div id="serviceModal" class="modal">
    <div class="modal-content">
        <h2>🔧 إضافة صيانة</h2>

        <div class="form-group">
            <label>تاريخ الصيانة</label>
            <input type="date" id="serviceDate">
        </div>

        <div class="form-group">
            <label>ممشى السيارة (كم)</label>
            <input type="number" id="serviceKm" placeholder="مثال: 125000">
        </div>

        <div class="form-group">
            <label>ماذا تم إصلاحه؟</label>
            <textarea id="serviceDetails" placeholder="مثال: تغيير الزيت والبواجي..."></textarea>
        </div>

        <div class="form-buttons">
            <button class="save-button" onclick="saveService()">حفظ الصيانة</button>
            <button class="cancel-button" onclick="closeServiceModal()">إلغاء</button>
        </div>
    </div>
</div>

<script>
let cars = JSON.parse(localStorage.getItem("mechanicCars")) || [];
let editingCarId = null;
let selectedCarId = null;

function saveData() {
    localStorage.setItem("mechanicCars", JSON.stringify(cars));
}

function displayCars() {
    const list = document.getElementById("carList");
    const search = document.getElementById("search").value.toLowerCase().trim();

    list.innerHTML = "";

    const filteredCars = cars.filter(car => {
        return (
            car.owner.toLowerCase().includes(search) ||
            car.name.toLowerCase().includes(search)
        );
    });

    if (filteredCars.length === 0) {
        list.innerHTML = `
            <div class="empty">
                لا توجد سيارات مطابقة للبحث.
            </div>
        `;
        updateStats();
        return;
    }

    filteredCars.forEach(car => {
        let lastService = null;

        if (car.services && car.services.length > 0) {
            lastService = [...car.services].sort(
                (a, b) => new Date(b.date) - new Date(a.date)
            )[0];
        }

        const card = document.createElement("div");
        card.className = "car-card";

        card.innerHTML = `
            <div class="car-header">
                <div>
                    <div class="car-name">🚗 ${escapeHTML(car.name)}</div>
                    <div class="owner">👤 ${escapeHTML(car.owner)}</div>
                </div>
                <div>
                    <button class="edit-button" onclick="editCar(${car.id})">✏️ تعديل</button>
                </div>
            </div>

            <div class="info">
                <div class="info-box">
                    <small>سنة السيارة</small>
                    <strong>${car.year || "-"}</strong>
                </div>
                <div class="info-box">
                    <small>آخر صيانة</small>
                    <strong>${lastService ? formatDate(lastService.date) : "-"}</strong>
                </div>
                <div class="info-box">
                    <small>آخر ممشى</small>
                    <strong>${lastService ? Number(lastService.km).toLocaleString() + " كم" : "-"}</strong>
                </div>
            </div>

            ${
                lastService
                ? `
                <div class="repair">
                    <div class="repair-title">🔧 آخر إصلاح</div>
                    <div>${escapeHTML(lastService.details)}</div>
                </div>
                `
                : `
                <div class="repair">
                    لم يتم تسجيل أي صيانة بعد.
                </div>
                `
            }

            <div class="actions">
                <button class="service-button" onclick="openServiceModal(${car.id})">🔧 إضافة صيانة</button>
                <button class="edit-button" onclick="viewHistory(${car.id})">📋 سجل الصيانة</button>
                <button class="delete-button" onclick="deleteCar(${car.id})">🗑️ حذف</button>
            </div>
        `;

        list.appendChild(card);
    });

    updateStats();
}

function updateStats() {
    document.getElementById("carCount").textContent = cars.length;

    let total = 0;
    cars.forEach(car => {
        total += car.services ? car.services.length : 0;
    });

    document.getElementById("serviceCount").textContent = total;
}

function openCarModal() {
    editingCarId = null;
    document.getElementById("modalTitle").textContent = "➕ إضافة سيارة";
    document.getElementById("ownerName").value = "";
    document.getElementById("carName").value = "";
    document.getElementById("carYear").value = "";
    document.getElementById("carModal").style.display = "block";
}

function editCar(id) {
    const car = cars.find(c => c.id === id);
    if (!car) return;

    editingCarId = id;
    document.getElementById("modalTitle").textContent = "✏️ تعديل السيارة";
    document.getElementById("ownerName").value = car.owner;
    document.getElementById("carName").value = car.name;
    document.getElementById("carYear").value = car.year;
    document.getElementById("carModal").style.display = "block";
}

function saveCar() {
    const owner = document.getElementById("ownerName").value.trim();
    const name = document.getElementById("carName").value.trim();
    const year = document.getElementById("carYear").value.trim();

    if (!owner || !name) {
        alert("يرجى كتابة اسم صاحب السيارة ونوع السيارة.");
        return;
    }

    if (editingCarId) {
        const car = cars.find(c => c.id === editingCarId);
        car.owner = owner;
        car.name = name;
        car.year = year;
    } else {
        cars.push({
            id: Date.now(),
            owner: owner,
            name: name,
            year: year,
            services: []
        });
    }

    saveData();
    closeCarModal();
    displayCars();
}

function deleteCar(id) {
    const car = cars.find(c => c.id === id);
    if (!car) return;

    const confirmDelete = confirm("هل أنت متأكد من حذف السيارة وجميع سجلات صيانتها؟");
    if (!confirmDelete) return;

    cars = cars.filter(c => c.id !== id);
    saveData();
    displayCars();
}

function openServiceModal(id) {
    selectedCarId = id;
    document.getElementById("serviceDate").value = new Date().toISOString().split("T")[0];
    document.getElementById("serviceKm").value = "";
    document.getElementById("serviceDetails").value = "";
    document.getElementById("serviceModal").style.display = "block";
}

function saveService() {
    const date = document.getElementById("serviceDate").value;
    const km = document.getElementById("serviceKm").value;
    const details = document.getElementById("serviceDetails").value.trim();

    if (!date || !km || !details) {
        alert("يرجى إدخال التاريخ والممشى وما تم إصلاحه.");
        return;
    }

    const car = cars.find(c => c.id === selectedCarId);
    if (!car) return;

    if (!car.services) {
        car.services = [];
    }

    car.services.push({
        id: Date.now(),
        date: date,
        km: km,
        details: details
    });

    saveData();
    closeServiceModal();
    displayCars();
}

function viewHistory(id) {
    const car = cars.find(c => c.id === id);
    if (!car) return;

    if (!car.services || car.services.length === 0) {
        alert("لا توجد صيانة مسجلة لهذه السيارة.");
        return;
    }

    const services = [...car.services].sort(
        (a, b) => new Date(b.date) - new Date(a.date)
    );

    let history = "🚗 " + car.name + "\n👤 " + car.owner + "\n\n";
    history += "===== سجل الصيانة =====\n\n";

    services.forEach((service, index) => {
        history += (index + 1) + ". " + formatDate(service.date) + "\n";
        history += "الممشى: " + Number(service.km).toLocaleString() + " كم\n";
        history += "الإصلاح: " + service.details + "\n\n";
    });

    alert(history);
}

function closeCarModal() {
    document.getElementById("carModal").style.display = "none";
}

function closeServiceModal() {
    document.getElementById("serviceModal").style.display = "none";
}

function formatDate(date) {
    const parts = date.split("-");
    if (parts.length !== 3) {
        return date;
    }
    return parts[2] + "/" + parts[1] + "/" + parts[0];
}

function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

displayCars();
</script>

</body>
</html>
