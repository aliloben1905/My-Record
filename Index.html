<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل ورشة الصيانة</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f6f9; margin: 0; padding: 15px; direction: rtl; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        label { display: block; margin-top: 10px; font-weight: bold; color: #555; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; padding: 12px; width: 100%; margin-top: 15px; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #218838; }
        .car-card { background: #fff3cd; border: 1px solid #ffeeba; padding: 12px; margin-top: 15px; border-radius: 5px; position: relative; }
        .car-card h4 { margin: 0 0 5px 0; color: #856404; }
        .car-card p { margin: 4px 0; color: #333; font-size: 14px; }
        .delete-btn { background-color: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; float: left; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h2>سجل صيانة السيارات</h2>
    
    <label>اسم الزبون:</label>
    <input type="text" id="clientName" placeholder="أدخل اسم الزبون">

    <label>اسم السيارة:</label>
    <input type="text" id="carName" placeholder="أدخل نوع وموديل السيارة">

    <label>تاريخ صنع السيارة (الموديل):</label>
    <input type="text" id="carModelYear" placeholder="مثال: 2015">

    <label>تاريخ الصيانة:</label>
    <input type="date" id="maintenanceDate">

    <label>القطع المصلحة / المستبدلة:</label>
    <input type="text" id="fixedParts" placeholder="مثال: فلتر، زيت، تيل فرامل...">

    <label>الممشى (الكيلومترات):</label>
    <input type="text" id="carMileage" placeholder="مثال: 150000 كم">

    <label>ملاحظات مهمة:</label>
    <textarea id="carNotes" rows="3" placeholder="أي ملاحظات إضافية عن السيارة..."></textarea>

    <button onclick="saveCarData()">حفظ السجل</button>

    <h3 style="margin-top: 30px; border-bottom: 2px solid #ddd; padding-bottom: 5px;">السيارات المسجلة سابِقاً:</h3>
    <div id="recordsList"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", loadRecords);

    function saveCarData() {
        const client = document.getElementById('clientName').value;
        const car = document.getElementById('carName').value;
        const carYear = document.getElementById('carModelYear').value;
        const mDate = document.getElementById('maintenanceDate').value;
        const parts = document.getElementById('fixedParts').value;
        const mileage = document.getElementById('carMileage').value;
        const notes = document.getElementById('carNotes').value;

        if(!client || !car) {
            alert('الرجاء إدخال اسم الزبون واسم السيارة على الأقل!');
            return;
        }

        const record = { client, car, carYear, mDate, parts, mileage, notes };
        
        let records = JSON.parse(localStorage.getItem('carRecords')) || [];
        records.push(record);
        localStorage.setItem('carRecords', JSON.stringify(records));

        alert('تم حفظ البيانات بنجاح!');
        clearForm();
        loadRecords();
    }

    function clearForm() {
        document.getElementById('clientName').value = '';
        document.getElementById('carName').value = '';
        document.getElementById('carModelYear').value = '';
        document.getElementById('maintenanceDate').value = '';
        document.getElementById('fixedParts').value = '';
        document.getElementById('carMileage').value = '';
        document.getElementById('carNotes').value = '';
    }

    function loadRecords() {
        const listDiv = document.getElementById('recordsList');
        listDiv.innerHTML = '';
        let records = JSON.parse(localStorage.getItem('carRecords')) || [];

        records.forEach((rec, index) => {
            listDiv.innerHTML += `
                <div class="car-card">
                    <button class="delete-btn" onclick="deleteRecord(${index})">حذف</button>
                    <h4>${rec.car} (موديل: ${rec.carYear || 'غير محدد'}) - (الزبون: ${rec.client})</h4>
                    <p><strong>تاريخ الصيانة:</strong> ${rec.mDate || 'غير محدد'}</p>
                    <p><strong>القطع المصلحة:</strong> ${rec.parts || 'لا يوجد'}</p>
                    <p><strong>الممشى:</strong> ${rec.mileage || 'غير محدد'}</p>
                    <p><strong>ملاحظات:</strong> ${rec.notes || 'لا توجد'}</p>
                </div>
            `;
        });
    }

    function deleteRecord(index) {
        let records = JSON.parse(localStorage.getItem('carRecords')) || [];
        records.splice(index, 1);
        localStorage.setItem('carRecords', JSON.stringify(records));
        loadRecords();
    }
</script>

</body>
</html>
